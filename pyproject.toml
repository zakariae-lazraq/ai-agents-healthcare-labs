[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "labkit"
version = "0.1.0"
description = "Small helpers for the 'AI Agents for Healthcare and Diagnostics' labs"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = ["google-adk==2.15.0", "ipython"]

[tool.setuptools]
packages = ["labkit"]

[tool.pytest.ini_options]
markers = ["live: needs a real GOOGLE_API_KEY (skipped otherwise)"]
